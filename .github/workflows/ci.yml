name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Build first: packages typecheck against each other's dist (e.g. dunstkreis' tests import @himmel/sternzeit).
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
